<!DOCTYPE html>
<html>
<head>
    <title>Aprobar Cuentas</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #007bff; color: white; }
        tr:hover { background: #f9f9f9; }
        .actions { display: flex; gap: 10px; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .approve { background: #28a745; color: white; }
        .approve:hover { background: #218838; }
        .reject { background: #dc3545; color: white; }
        .reject:hover { background: #c82333; }
        .empty { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aprobar Cuentas Pendientes</h1>

        {% if pending_users %}
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Nombre</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in pending_users %}
                        <tr>
                            <td>{{ user.email }}</td>
                            <td>{{ user.first_name }}</td>
                            <td>
                                <form method="POST" style="display: inline;">
                                    {% csrf_token %}
                                    <input type="hidden" name="user_id" value="{{ user.id }}">
                                    <input type="hidden" name="action" value="approve">
                                    <button type="submit" class="approve">Aprobar</button>
                                </form>
                                <form method="POST" style="display: inline;">
                                    {% csrf_token %}
                                    <input type="hidden" name="user_id" value="{{ user.id }}">
                                    <input type="hidden" name="action" value="reject">
                                    <button type="submit" class="reject">Rechazar</button>
                                </form>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <div class="empty">
                <p>No hay cuentas pendientes de aprobación.</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
